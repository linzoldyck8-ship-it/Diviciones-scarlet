<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Scarlet Esports - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">🎮 Scarlet Esports Management</a>
        </div>
    </nav>
    <div class="container text-center mt-5">
        <h2>Selecciona una División</h2>
        <form action="/dashboard" method="GET" class="mt-4 col-md-4 mx-auto">
            <select name="division" class="form-select mb-3">
                <option value="valorant_a">Valorant A</option>
                <option value="valorant_b">Valorant B</option>
                <option value="overwatch">Overwatch</option>
                <option value="cs">Counter-Strike</option>
            </select>
            <button type="submit" class="btn btn-danger w-100">Ingresar al Panel</button>
        </form>
    </div>
</body>
</html>
