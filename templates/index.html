<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Integrantes - Esports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-container">
    <div class="portal-header">
        <h1 class="portal-title">ORGANIZACIÓN ESPORTS — PORTAL DE INTEGRANTES</h1>
    </div>

    <div class="auth-grid">
        <!-- FORMULARIO DE INICIAR SESIÓN -->
        <div class="auth-card">
            <h2>Iniciar Sesión</h2>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="tu_correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-scarlet-block">Ingresar al Panel</button>
            </form>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="auth-card">
            <h2>Registro de Integrantes</h2>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Ej: Carlos Mendoza" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Discord (Usuario)</label>
                    <input type="text" name="discord_tag" class="form-control" placeholder="usuario_discord" required>
                </div>
                <div class="form-group">
                    <label>División / Juego</label>
                    <select name="division" class="form-control" required>
                        <option value="Valorant A">Valorant A</option>
                        <option value="Valorant B">Valorant B</option>
                        <option value="League of Legends">League of Legends</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>IGN (Nombre en juego con Tag)</label>
                    <input type="text" name="game_ign" class="form-control" placeholder="Player#1234" required>
                </div>
                <div class="form-group">
                    <label>Rol Principal (Opcional)</label>
                    <input type="text" name="main_role" class="form-control" placeholder="Ej: Entry / Tank / Controller">
                </div>
                <div class="form-group">
                    <label>Agente / Personaje Main (Opcional)</label>
                    <input type="text" name="main_agent" class="form-control" placeholder="Ej: Jett / Reinhardt">
                </div>
                <button type="submit" class="btn-scarlet-block">Completar Registro</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
