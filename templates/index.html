<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Integrantes - Esports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-container">
    <div class="portal-header">
        <h1 class="portal-title">ORGANIZACIÓN ESPORTS — PORTAL DE INTEGRANTES</h1>
    </div>

    <div class="auth-grid">
        <!-- FORMULARIO DE INICIAR SESIÓN -->
        <div class="corporate-card">
            <h2 style="margin-top:0; color:#fff; font-size:1.2rem; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Iniciar Sesión</h2>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group" style="margin-bottom:15px; display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="tu_correo@ejemplo.com" required>
                </div>
                <div class="form-group" style="margin-bottom:15px; display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; padding:10px; margin-top:5px;">Ingresar al Panel</button>
            </form>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="corporate-card">
            <h2 style="margin-top:0; color:#fff; font-size:1.2rem; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Registro de Integrantes</h2>
            <form action="{{ url_for('register') }}" method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div style="grid-column: span 2; display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Nombre Completo</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Ej: Carlos Mendoza" required>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Discord (Usuario)</label>
                    <input type="text" name="discord_tag" class="form-control" placeholder="usuario_discord" required>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">División / Juego</label>
                    <select name="division" class="form-control" required>
                        <option value="Valorant A">Valorant A</option>
                        <option value="Valorant B">Valorant B</option>
                        <option value="Valorant C">Valorant C</option>
                        <option value="Valorant Femenino">Valorant Femenino</option>
                        <option value="Overwatch A">Overwatch A</option>
                        <option value="Overwatch B">Overwatch B</option>
                        <option value="Counter Strike">Counter Strike</option>
                    </select>
                </div>
                <div style="grid-column: span 2; display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">IGN (Nombre en juego con Tag)</label>
                    <input type="text" name="game_ign" class="form-control" placeholder="Player#1234" required>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Rol Principal (Opcional)</label>
                    <input type="text" name="main_role" class="form-control" placeholder="Ej: Entry / Tank">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">Agente / Personaje (Opcional)</label>
                    <input type="text" name="favorite_agent" class="form-control" placeholder="Ej: Jett / Reinhardt">
                </div>
                <div style="grid-column: span 2; margin-top: 5px;">
                    <button type="submit" class="btn-primary" style="width:100%; padding:10px;">Completar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
